<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      background-color: hsl(0, 0%, 8%);
      font-size: 0.6875rem;
      text-align: center;
      color: white;
      padding-bottom: 20px;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: hsl(0, 0%, 8%);
    }

    .profile {
      height: 540px;
      width: 340px;
      padding: 23px;
      display: flex;
      border-radius: 15px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Inter', sans-serif;
      background-color: hsl(0, 0%, 12%);
    }

    .avatar {
      margin-bottom: 20px;
      width: 85px;
      height: 85px;
      border-radius: 50%;
    }

    h1 {
      margin: 0px;
      font-size: 1.5rem;
      font-weight: 700;
      color: hsl(0, 0%, 100%);
    }

    .location {
      font-size: 0.9rem;
      font-weight: 700;
      margin: 10px 0px;
      color: hsl(75, 94%, 57%);
    }

    p {
      margin: 18px 0px;
      font-size: 14px;
      font-weight: 300;
      color: hsl(0, 0%, 100%);
    }

    .button-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    button {
      width: 90%;
      height: 45px;
      display: flex;
      font-size: 14px;
      font-weight: 700;
      align-items: center;
      justify-content: center;
      margin: 7px 0px;
      padding: 10px 20px;
      border: none;
      border-radius: 9px;
      background-color: hsl(0, 0%, 20%);
      color: white;
      cursor: pointer;
    }

    button:hover {
      color: hsl(0, 0%, 12%);
      background-color: hsl(75, 94%, 57%);
    }




    @media (min-width: 360px) and (max-width: 1440px) {

      body {
        margin: 0;
        padding: 0;
        height: 100vh;
      }

      .container {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: hsl(0, 0%, 8%);
      }

      .profile {
        height: 530px;
        width: 295px;
        padding: 10px;
        display: flex;
        border-radius: 15px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: 'Inter', sans-serif;
        background-color: hsl(0, 0%, 12%);
      }

      .avatar {
        margin-bottom: 20px;
        width: 85px;
        height: 85px;
        border-radius: 50%;
      }

      h1 {
        margin: 0px;
        font-size: 1.5rem;
        font-weight: 700;
        color: hsl(0, 0%, 100%);
      }

      .location {
        font-size: 0.9rem;
        font-weight: 700;
        margin: 10px 0px;
        color: hsl(75, 94%, 57%);
      }

      p {
        margin: 18px 0px;
        font-size: 14px;
        font-weight: 300;
        color: hsl(0, 0%, 100%);
      }

      .button-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      button {
        width: 90%;
        height: 45px;
        display: flex;
        font-size: 14px;
        font-weight: 700;
        align-items: center;
        justify-content: center;
        margin: 7px 0px;
        padding: 10px 20px;
        border: none;
        border-radius: 9px;
        background-color: hsl(0, 0%, 20%);
        color: white;
        cursor: pointer;
      }

      button:hover {
        color: hsl(0, 0%, 12%);
        background-color: hsl(75, 94%, 57%);
      }

    }
  </style>
</head>

<body>
  <div class="container">
    <div class="profile">
      <img src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall" class="avatar">

      <h1>Jessica Randall</h1>
      <p class="location">London, United Kingdom</p>
      <p>"Front-end developer and avid reader."</p>
      <div class="button-container">
        <button>GitHub</button>
        <button>Frontend Mentor</button>
        <button>LinkedIn</button>
        <button>Twitter</button>
        <button>Instagram</button>
      </div>

    </div>

  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Oluwatobi David</a>.
  </footer>


</body>

</html>
